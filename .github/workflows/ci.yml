name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 1.16
        uses: actions/setup-java@v1
        with:
          java-version: 1.16

      - name: Build and Test
        run: |
          ./gradlew build
          ./gradlew api-test:test